name: 同步到滴答清单

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 0-14/1,22,23 * * *'

permissions:
  contents: read

concurrency:
  group: dida-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x
      - name: Restore dependencies
        run: dotnet restore ./TodoSynchronizer.CLI/TodoSynchronizer.CLI.csproj
      - name: Build
        run: dotnet build ./TodoSynchronizer.CLI/TodoSynchronizer.CLI.csproj --no-restore -c Release
      - name: Restore Dida source index
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/dida-source-index.bin
          key: dida-source-index-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dida-source-index-v1-
      - name: Run
        if: github.event_name != 'pull_request'
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          DIDA_API: ${{ secrets.DIDA_API }}
          DIDA_SOURCE_INDEX: ${{ runner.temp }}/dida-source-index.bin
        run: ./TodoSynchronizer.CLI/bin/Release/net6.0/TodoSynchronizer.CLI -canvastoken "$CANVAS_TOKEN" -configfile config.yaml -dida
      - name: Save Dida source index
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/dida-source-index.bin
          key: dida-source-index-v1-${{ github.run_id }}-${{ github.run_attempt }}
